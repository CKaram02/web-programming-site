{% extends "base.html" %}

{% block title %}Home | Portfolio{% endblock %}

{% block main %}
<section class="weekly-section">
    <h2>Weekly Work</h2>
    <ul class="weekly-list">
        {% for item in weekly_work %}
            <li><a href="{{ item.url }}">Week {{ item.week }} — {{ item.title }}</a></li>
        {% else %}
            <li>Week 1 — live site launched.</li>
        {% endfor %}
    </ul>
</section>
{% endblock %}
